version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dealerdesk-db
    environment:
      POSTGRES_DB: dealerdesk
      POSTGRES_USER: dealerdesk_user
      POSTGRES_PASSWORD: dealerdesk_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealerdesk_user -d dealerdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: dealerdesk-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000 --noreload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://dealerdesk_user:dealerdesk_pass@db:5432/dealerdesk
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=docker-dealerdesk-secret-key-2026
      - SUPPLIER_API_URL=http://127.0.0.1:8099
      - SUPPLIER_API_KEY=
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      - GROQ_API_KEY=
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
